 Deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: taskapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: taskapp
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: taskapp
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: taskapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
